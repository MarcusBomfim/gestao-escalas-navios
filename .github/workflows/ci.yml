name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore backend/PortManagement.slnx

      - name: Validar formatação
        run: dotnet format backend/PortManagement.slnx --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build backend/PortManagement.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test backend/PortManagement.slnx --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar análise estática
        run: npm run lint

      - name: Gerar aplicação
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

  containers:
    name: Container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Construir imagem da API
        run: >-
          docker build
          --file backend/Dockerfile
          --tag port-management-api:ci
          .

      - name: Construir imagem da interface
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg VITE_API_URL=http://localhost:8080
          --tag port-management-web:ci
          .

      - name: Conferir imagens geradas
        run: docker image inspect port-management-api:ci port-management-web:ci
