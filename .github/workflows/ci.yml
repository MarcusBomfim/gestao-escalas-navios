name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore backend/PortManagement.slnx

      - name: Validar formatação
        run: dotnet format backend/PortManagement.slnx --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build backend/PortManagement.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test backend/PortManagement.slnx --configuration Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar análise estática
        run: npm run lint

      - name: Gerar aplicação
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

  containers:
    name: Container images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Construir imagem da API
        run: >-
          docker build
          --file backend/Dockerfile
          --tag port-management-api:ci
          .

      - name: Construir imagem da interface
        run: >-
          docker build
          --file frontend/Dockerfile
          --build-arg VITE_API_URL=http://localhost:8080
          --tag port-management-web:ci
          .

      - name: Conferir imagens geradas
        run: docker image inspect port-management-api:ci port-management-web:ci

  end-to-end:
    name: End-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: port-management-e2e
      POSTGRES_DB: port_management_e2e
      POSTGRES_USER: port_management_e2e
      POSTGRES_PORT: 5432
      API_PORT: 8080
      WEB_PORT: 5173
      VITE_API_URL: http://localhost:8080
      WEB_ORIGIN: http://localhost:5173
      E2E_BASE_URL: http://localhost:5173

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências dos testes
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Gerar segredos efêmeros
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 24)"
          jwt_signing_key="$(openssl rand -base64 48 | tr -d '\n')"
          demo_user_password="E2e!$(openssl rand -hex 16)Aa9"

          echo "::add-mask::$postgres_password"
          echo "::add-mask::$jwt_signing_key"
          echo "::add-mask::$demo_user_password"

          {
            echo "POSTGRES_PASSWORD=$postgres_password"
            echo "JWT_SIGNING_KEY=$jwt_signing_key"
            echo "DEMO_USER_PASSWORD=$demo_user_password"
          } >> "$GITHUB_ENV"

      - name: Iniciar aplicação completa
        shell: bash
        run: |
          docker compose up --build --detach

          for attempt in $(seq 1 90); do
            if curl --fail --silent --output /dev/null http://localhost:8080/health/ready && \
               curl --fail --silent --output /dev/null http://localhost:5173/health; then
              exit 0
            fi
            sleep 2
          done

          echo "A aplicação não ficou pronta dentro do tempo esperado."
          docker compose ps --all
          exit 1

      - name: Executar testes de aceitação
        working-directory: frontend
        run: npm run test:e2e

      - name: Coletar diagnóstico da falha
        if: failure()
        shell: bash
        run: |
          mkdir -p TestResults/e2e
          docker compose ps --all > TestResults/e2e/containers.txt 2>&1 || true
          docker compose logs --no-color > TestResults/e2e/docker-compose.log 2>&1 || true

      - name: Publicar evidências da falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            TestResults/e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Encerrar ambiente de testes
        if: always()
        run: docker compose down --volumes --remove-orphans || true
