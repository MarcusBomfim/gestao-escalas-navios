name: port-management-production

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  migrations:
    image: ghcr.io/marcusbomfim/port-management-api:${IMAGE_TAG:-latest}
    command: ["--migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${PUBLIC_WEB_URL}
      PasswordRecovery__SmtpHost: ${SMTP_HOST}
      PasswordRecovery__SmtpPort: ${SMTP_PORT:-587}
      PasswordRecovery__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      PasswordRecovery__FromAddress: ${SMTP_FROM_ADDRESS}
      PasswordRecovery__FromName: ${SMTP_FROM_NAME:-Port Management}
      PasswordRecovery__Username: ${SMTP_USERNAME:-}
      PasswordRecovery__Password: ${SMTP_PASSWORD:-}
      PasswordRecovery__PublicWebUrl: ${PUBLIC_WEB_URL}
      Demo__PublicViewerEnabled: ${PUBLIC_DEMO_ENABLED:-true}
      DataProtection__KeysPath: /app/data-protection-keys
      DataProtection__AllowUnprotectedKeys: ${DATA_PROTECTION_ALLOW_UNPROTECTED:-false}
      DataProtection__CertificatePath: ${DATA_PROTECTION_CERTIFICATE_PATH:-}
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:-}
      # Com X-Forwarded-Proto reconhecido, o redirecionamento não entra em laço
      # atrás do proxy TLS e o HSTS passa a ser emitido.
      Security__EnforceHttps: ${ENFORCE_HTTPS:-true}
      # Rede de onde o X-Forwarded-For é aceito. Restrinja ao IP do seu proxy.
      Security__TrustedProxies__0: ${TRUSTED_PROXY_NETWORK:-172.16.0.0/12}
      AllowedHosts: ${API_ALLOWED_HOSTS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - data_protection_production_keys:/app/data-protection-keys
    security_opt:
      - no-new-privileges:true
    restart: "no"

  seed-demo:
    image: ghcr.io/marcusbomfim/port-management-api:${IMAGE_TAG:-latest}
    command: ["--seed-demo"]
    environment:
      <<: *api-environment
      Demo__UserPassword: ${DEMO_USER_PASSWORD}
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - data_protection_production_keys:/app/data-protection-keys
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    image: ghcr.io/marcusbomfim/port-management-api:${IMAGE_TAG:-latest}
    environment:
      <<: *api-environment
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      seed-demo:
        condition: service_completed_successfully
    volumes:
      - data_protection_production_keys:/app/data-protection-keys
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    restart: unless-stopped

  web:
    image: ghcr.io/marcusbomfim/port-management-web:${IMAGE_TAG:-latest}
    environment:
      # Entram na diretiva connect-src da Content-Security-Policy.
      API_ORIGIN: ${PUBLIC_API_URL:-}
      API_WEBSOCKET_ORIGIN: ${PUBLIC_API_WEBSOCKET_URL:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_production_data:
  data_protection_production_keys:
