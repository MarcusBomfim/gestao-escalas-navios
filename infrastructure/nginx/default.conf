server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A versão do nginx no cabeçalho Server só ajuda quem está varrendo.
    server_tokens off;

    # O corpo de requisição não tem uso aqui: a interface é estática.
    client_max_body_size 1m;

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location = /health {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "healthy\n";
    }

    # Arquivos ocultos e de backup nunca devem ser servidos.
    location ~ /\. {
        deny all;
    }
}
